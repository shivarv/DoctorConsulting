# Serves the built Vite bundle. Rendered from a template at container start,
# so ${PORT} is filled in by the host's value — see frontend/Dockerfile.prod.

server {
    listen      ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresses on the way out. text/html is always compressed by nginx and
    # must not be listed again here.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css text/plain application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames (index-a1b2c3d4.js), so a changed file
    # is a changed URL and a stale cache is impossible. Cache them forever.
    # One directive, not `expires 1y` plus an add_header: those emit two
    # separate Cache-Control headers and leave it to the browser to reconcile.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one file whose name never changes, so it must never be
    # cached — otherwise a browser keeps loading the old bundle's asset URLs
    # after a deploy and the site breaks until a manual refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # frontend/src/main.tsx uses BrowserRouter: paths like /doctors/anjali-menon
    # have no file behind them and are resolved by React Router in the browser.
    # Hand back index.html so a direct visit or a hard refresh works instead of
    # 404ing. Real files still win, because try_files checks them first.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
