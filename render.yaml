# Render blueprint — the deployed equivalent of docker-compose.yml.
#
# Render does not read compose files, so the same three pieces are described
# again here: a managed Postgres, the API from ./Dockerfile, and the frontend
# built to static files. Push this to the default branch, then in Render:
# New → Blueprint → pick this repo.
#
# Two differences from local worth knowing before you read on:
#
#   * The database starts EMPTY. Render has no equivalent of the
#     docker-entrypoint-initdb.d hook that loads db/*.sql locally, so the
#     schema and demo data are pushed in once with ./db/bootstrap.sh — see
#     DEPLOY.md. Nothing below does it for you.
#   * The frontend is not a container. Locally it is a Vite dev server; here it
#     is `npm run build` output on Render's CDN, which is faster, free, and
#     what Vite is designed for. frontend/Dockerfile stays dev-only.

databases:
  - name: doctorconsulting-db
    databaseName: doctorconsulting
    user: doctorconsulting
    plan: free
    # Local runs Postgres 18; Render does not offer it yet. The schema is
    # portable — GENERATED ALWAYS AS IDENTITY and TEXT[] are both 12+ features
    # — so 17 costs nothing. Raise this when Render adds 18.
    postgresMajorVersion: "17"

services:
  # ---------------------------------------------------------------------------
  # API — FastAPI, from the root Dockerfile
  # ---------------------------------------------------------------------------
  - type: web
    name: doctorconsulting-api
    runtime: docker
    plan: free
    # Must match the database's region, or the internal connection string
    # below will not resolve and every query goes out over the public internet.
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /health already exists in src/main.py and touches no database, so it
    # answers even when Postgres is down — which is what you want from a
    # liveness check. Render restarts the service if this stops responding.
    healthCheckPath: /health
    envVars:
      # The internal connection string: reachable only from inside Render's
      # network, no SSL negotiation, no egress. Wired automatically, so the
      # password never appears in this file or in the dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: doctorconsulting-db
          property: connectionString

      # Read by src/core/config.py. The default there is localhost:5173, so
      # without this every browser request from the deployed frontend is
      # blocked by CORS — and the failure looks like a network error, not a
      # permissions one.
      #
      # Hardcoded because Render's fromService only exposes `host` (no scheme)
      # and an Origin header must include one. If the name below is already
      # taken globally, Render appends a suffix — check the static site's real
      # URL after the first deploy and correct this value.
      - key: CORS_ORIGINS
        value: https://doctorconsulting-web.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend — Vite build on Render's CDN
  # ---------------------------------------------------------------------------
  - type: web
    name: doctorconsulting-web
    runtime: static
    rootDir: frontend
    # npm ci, not npm install: it honours package-lock.json exactly, so the
    # deployed build uses the versions you tested against.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the bundle at BUILD time, not read at runtime —
      # frontend/src/services/apiClient.ts reads import.meta.env, which Vite
      # replaces with a string literal during `npm run build`. Changing this
      # therefore needs a rebuild, not a restart.
      - key: VITE_API_BASE_URL
        value: https://doctorconsulting-api.onrender.com
    routes:
      # frontend/src/main.tsx uses BrowserRouter, so /doctors/anjali-menon is a
      # client-side route with no file behind it. Without this rewrite a direct
      # visit or a hard refresh on any path but / returns 404. Last rule, so it
      # only catches what no real file matched.
      - type: rewrite
        source: /*
        destination: /index.html
