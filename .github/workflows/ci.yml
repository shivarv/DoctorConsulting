# Test, then deploy.
#
# Pull requests against main run the checks. Pushes to main (a merge is a push)
# run the same checks and then, only if both pass, tell Render to deploy.
#
# This workflow — not Render's own Auto-Deploy setting — is what deploys.
# Leave Auto-Deploy On in the dashboard and both fire on every push, with
# Render's copy not waiting for the tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Queue rather than cancel: two merges in quick succession should deploy in
# order, so main's HEAD is what ends up live.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      # tests/conftest.py *skips* the repository and API tests when Postgres is
      # unreachable rather than failing, which in CI would mean a green run
      # that tested almost nothing. A real server is what makes them run.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: doctorconsulting
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The container is up well before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d doctorconsulting"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # Connecting as the owner, so db/roles.sql is not loaded — it hardcodes a
      # development password for dc_app and grants nothing these tests need
      # that postgres does not already have. This also matches Render, where
      # DATABASE_URL is the database owner too.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doctorconsulting

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches python:3.13-slim in the Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Load schema and demo data
        # The same two files docker-compose mounts into
        # docker-entrypoint-initdb.d locally, in the same order — the seed
        # inserts into tables the schema creates.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed_doctors.sql

      - name: Run tests
        run: python -m pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node 20.19+ or 22.12+.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, not npm install: honours package-lock.json exactly, and is what
      # render.yaml runs.
      - run: npm ci

      - run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so a type error fails here
      # rather than in Render's build minutes.
      - run: npm run build

  deploy:
    name: Deploy to Render
    # Both must pass. `needs` is what makes this a gate.
    needs: [backend, frontend]
    # The event check matters beyond the ref check: without it a PR *targeting*
    # main would deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API deploy
        # Each hook is a secret URL that already identifies the service.
        # --fail-with-body turns an HTTP 4xx/5xx into a non-zero exit, so a
        # revoked or mistyped hook fails the job instead of silently passing.
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger frontend deploy
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"

      # The hook returns as soon as Render accepts the job, so green here means
      # "deploy started", not "deploy succeeded".
      - name: Note
        run: echo "Deploys queued on Render. Green here means accepted, not live."
